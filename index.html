<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Hi, I'm Vlad</title>
    <style>
        body, html {
            margin: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #dvd {
            position: absolute;
            font-size: 48px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            color: #ff0000;
            user-select: none;
            white-space: nowrap;
        }
    </style>
</head>
<body>

    <div id="dvd">Hi, I'm Vlad</div>

    <script>
        const dvd = document.getElementById('dvd');
        let x = Math.random() * (window.innerWidth - dvd.clientWidth);
        let y = Math.random() * (window.innerHeight - dvd.clientHeight);
        let dx = 3;
        let dy = 3;

        const colors = ['#ff0000', '#00ff00', '#0000ff', '#ffff00', '#ff00ff', '#00ffff'];
        let colorIndex = 0;

        function changeColor() {
            colorIndex = (colorIndex + 1) % colors.length;
            dvd.style.color = colors[colorIndex];
        }

        function frame() {
            x += dx;
            y += dy;

            if (x + dvd.clientWidth >= window.innerWidth) {
                x = window.innerWidth - dvd.clientWidth;
                dx = -dx;
                changeColor();
            } else if (x <= 0) {
                x = 0;
                dx = -dx;
                changeColor();
            }

            if (y + dvd.clientHeight >= window.innerHeight) {
                y = window.innerHeight - dvd.clientHeight;
                dy = -dy;
                changeColor();
            } else if (y <= 0) {
                y = 0;
                dy = -dy;
                changeColor();
            }

            dvd.style.left = x + 'px';
            dvd.style.top = y + 'px';
            requestAnimationFrame(frame);
        }

        frame();
    </script>
</body>
</html>
